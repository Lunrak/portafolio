<!doctype html>
<html lang="en">
	<head>
		<meta charset="UTF-8" />
		<meta
			name="viewport"
			content="width=device-width, initial-scale=1.0"
		/>
		<title>Encuesta</title>
	</head>
	<body>
		<form
			action="#"
			method="post"
		>
			<legend>Encuesta de Satisfaccion</legend>
			<p>
				<label for="nombre">Nombre:</label>
				<input
					type="text"
					name="nombre"
					id="nombre"
					required
				/>
			</p>
			<p>
				<label for="email">Email:</label>
				<input
					type="email"
					name="email"
					id="email"
					required
				/>
			</p>
			<p>
				<label for="edad">Edad:</label>
				<input
					type="number"
					name="edad"
					id="edad"
					min="10"
					max="80"
					value="30"
				/>
			</p>
			<p>
				<label for="visita">Fecha de visita</label>
				<input
					type="date"
					name="visita"
					id="visita"
				/>
			</p>
			<p>
				<label for="valoracion">Valoracion general</label>
				<input
					type="range"
					name="valoracion"
					id="valoracion"
					min="1"
					max="10"
				/>
			</p>
			<p>
				<label for="conocido">Como nos Conociste?</label>
				<select
					name="conocido"
					id="conocido"
				>
					<option value="comercial">Lo vi en un comercial</option>
					<option value="amigo">Me lo mostro un amigo</option>
					<option value="suerte">Pasaba y vi el lugar</option>
					<option value="otro">Otro</option>
				</select>
			</p>
			<p>
				<label for="volver">Volverias a visitarnos?</label>
				<input
					type="radio"
					name="volver"
					id="Si"
					value="Si"
				/>
				<label for="Si">Si</label>
				<input
					type="radio"
					name="volver"
					id="No"
					value="No"
				/>
				<label for="No">No</label>
				<input
					type="radio"
					name="volver"
					id="Tal Vez"
					value="Tal Vez"
				/>
				<label for="Tal Vez">Tal Vez</label>
			</p>
			<p>
				<label for="gusto">Que secciones te gustaron?</label>
				<br />

				<input
					type="checkbox"
					name="gusto"
					id="sobremi"
				/>
				<label for="sobremi">Sobre Mi</label>
				<br />

				<input
					type="checkbox"
					name="gusto"
					id="proyectos"
				/>
				<label for="proyectos">Proyectos</label>
				<br />

				<input
					type="checkbox"
					name="gusto"
					id="contacto"
				/>
				<label for="contacto">Contacto</label>
				<br />

				<input
					type="checkbox"
					name="gusto"
					id="experiencia"
				/>
				<label for="experiencia">Experiencia</label>
				<br />
			</p>
			<p>
				<input
					type="checkbox"
					name="terminos"
					id="terminos"
				/>
				<label for="terminos">Acepto los terminos y condiciones</label>
			</p>
		</form>
		<a href="/Index.html">Volver al portafolio</a>
	</body>
</html>
